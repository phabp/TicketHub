info:
    description: "TicketRest REST API"
    license:
        name: "Apache 2.0"
        url: "http://www.apache.org/licenses/LICENSE-2.0.html"
    title: "TicketRest"
    version: v1.0
openapi: 3.0.1

components:
    schemas:
        Ticket:
            properties:
                ticketId:
                    format: int64
                    type: integer
                title:
                    type: string
                description:
                    type: string
                category:
                    type: string
                priority:
                    type: string
                status:
                    type: string
                assignedToUserId:
                    format: int64
                    type: integer
            type: object

paths:
    /tickets/{ticketId}:
        get:
            operationId: getTicket
            parameters:
                - in: path
                  name: ticketId
                  required: true
                  schema:
                      format: int64
                      type: integer
            responses:
                "200":
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/Ticket"
                        application/xml:
                            schema:
                                $ref: "#/components/schemas/Ticket"
                    description: "Ticket retrieved successfully"